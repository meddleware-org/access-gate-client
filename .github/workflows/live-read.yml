name: Live read checks

# Read-only checks against public testnet (no secrets): the on-chain ABI of the access_gate
# builders, the event decoders against real events, and the pass-variant rendering. Weekly, because
# an access_gate republish or a fullnode change shows up here before it breaks a user.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Testnet read-only suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci
      - name: Live read-only suite
        env:
          GRPC_TESTNET: '1'
        run: npm run test:integration
