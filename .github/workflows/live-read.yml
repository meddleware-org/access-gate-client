name: Live read checks

# Read-only checks against public testnet (no secrets): the on-chain ABI of the access_gate
# builders, the event decoders against real events, and the pass-variant rendering. Weekly, because
# an access_gate republish or a fullnode change shows up here before it breaks a user.

on:
  schedule:
    # Mondays at 05:17 UTC (an odd minute, so it does not queue with the fleet's other jobs on the hour).
    - cron: '17 5 * * 1'
  # And on demand, for a check after a republish of the Move package.
  workflow_dispatch:

# Read-only: the suite reads public testnet and needs no key or secret.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule).
env:
  DO_NOT_TRACK: "1"

jobs:
  live:
    name: Testnet read-only suite
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 is the fleet baseline (D56).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci
      - name: Live read-only suite
        env:
          # The suites skip themselves unless this is set (vitest.integration.config.ts).
          GRPC_TESTNET: '1'
        run: npm run test:integration
